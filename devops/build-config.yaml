---
slackChannel: "eco-build"
initialReleaseTag: '0.8.0.300-dep-1010' # Use only for release build
whitesourceScan: true
build:
  - name: ubuntu
    imageCustom: devops/buildimages/ubuntu/image.sh
    basicBuildCommands: "_BUILD_ENV_VARS_ devops/scripts/build.sh"
    hostmachine_jenkins_label: "ubuntu16"
  - name: centos
    image: _DOCKER_REGISTRY_/rhel-ubi9-java17-gcc11:core-latest
    basicBuildCommands: "_BUILD_ENV_VARS_ devops/scripts/build.sh"
    hostmachine_jenkins_label: "redhat8"
    rpmSign: true

# "_DOCKER_REGISTRY_" and "_BUILD_ENV_VARS_" names will be generated and added automatically during the build
